<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quotes</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <button id="theme-btn" class="btn">Change Theme</button>
  <div class="container">
    <h1>Random Quotes</h1>
    <p id="quote" class="quote">Click the button to get a random quote</p>
    <p id="quote-author">(author)</p>
    <button id="generate-btn" class="btn">Generate Quote</button>
    <button id="toggle-favorite-btn" class="btn">Add to Favorites</button>
  </div>

  <div id="favorites-container" class="favorites-container">

  </div>


  <script type="module" src="script.js"></script>
</body>

</html>
